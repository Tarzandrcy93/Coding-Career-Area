<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronomètre | STC</title>
    <link rel="stylesheet" href="chronomètre.css" />
    <link rel="icon" href="Capture d'écran 2025-10-30 222330.png" type="image/x-icon">
  </head>
  <body>
    <div class="container">
      <img src="pixel-art-wall-clock-on-260nw-1358807156-removebg-preview.png" alt="Horloge" class="clock" />
      <div id="display">00.00.00.000</div>
      <div class="button">
        <img
          src="image_2025-10-30_214920172-removebg-preview.png"
          alt="play"
          id="startBtn"
          class="start"
        />
        <img
          src="2891096-removebg-preview.png"
          alt="pause"
          id="pauseBtn"
          class="pause"
        />
        <img
          src="turn-pixelated-ui-icon-refresh-page-rotating-arrow-go-back-previous-decision-editable-8bit-graphic-element-outline-isolated-user-interface-image-for-web-mobile-app-retro-style-vector.jpg"
          alt="réinistialiser"
          id="resetBtn"
          class="refresh"
        />
      </div>
    </div>


    <script src="chronomètre.js"></script>
  </body>
</html>
