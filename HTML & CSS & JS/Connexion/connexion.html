<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de connexion | STC</title>
    <link rel="stylesheet" href="connexion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
              <h1 class="nom">Créer un compte</h1>
              <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-apple"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-linkedin"></i></a>  
              </div>
              <input type="text"
               placeholder="Nom d'utilisateur" class="incs" />
                 <input type="email"
               placeholder="Email" class="incs" />
                 <input type="password"
               placeholder="Mot de passe" class="incs"/>
               <button>Inscrire</button>
            </form>
        </div>
         <div class="container" id="container">
        <div class="form-container sign-in">
            <form>
              <h1 class="nom">Se connecter</h1>
              <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-apple"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-linkedin"></i></a>  
              </div>
              <input type="text"
               placeholder="Email" class="incs" />
                 <input type="password"
               placeholder="Mot de passe" class="incs" />
               <a href="#" class="mdpo">Mot de passe oublié ?</a>
               <button>Se connecter</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1 class="nom">Content de te revoir !</h1>
                    <p>Entrez vos infos personnelles pour utiliser toutes les fonctionnalités du site</p>
                    <button class="hidden" id="login">Se connecter</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1 class="nom">Salut !</h1>
                    <p>Inscrivez-vous avec vos informations personnelles pour utiliser toutes les fonctionnalités du site</p>
                    <button class="hidden" id="register">Inscrire</button>
                </div>
            </div>
        </div>
    </div>

    <script src="connexion.js"></script>
</body>
</html>
