<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de connexion | TZN </title>
    <link rel="stylesheet" href="cmp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="Peugeot_2021_Logo.svg.png" type="image/x-icon">
</head>
<body>

  <a href="peugeot.html"><img src="r.png" class="pgt" alt="Peugeot" /></a>

  <div class="icone">
   <a href="cmp.html"><img src="image_2026-08-17_201846861-removebg-preview.png" alt="cmp" class="cmp" ></a>
   <a href="#formulaire"><img src="f.png" alt="fr" class="form"></a>
   <a href="p1.html "><img src="v.png" alt="v" class="vol"></a>
  </div>
  
  <div class="logo-line"></div>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
              <h1 class="nom">Créer un compte</h1>
              <div class="social-icons">
                <a href="#" class="icon" title="Se connecter avec Google"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="icon" title="Se connecter avec GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icon" title="Se connecter avec Apple"><i class="fa-brands fa-apple"></i></a>
                <a href="#" class="icon" title="Se connecter avec LinkedIn"><i class="fa-brands fa-linkedin"></i></a>  
              </div>
              <input type="text"
               placeholder="Nom d'utilisateur" class="incs" />
                 <input type="email"
               placeholder="Email" class="incs" />
                 <input type="password"
               placeholder="Mot de passe" class="incs"/>
               <button type="submit">Inscrire</button>
            </form>
        </div>
         <div class="container" id="container">
        <div class="form-container sign-in">
            <form>
              <h1 class="nom">Se connecter</h1>
              <div class="social-icons">
             <a href="#" class="icon" title="Se connecter avec Google"><i class="fa-brands fa-google"></i></a>
             <a href="#" class="icon" title="Se connecter avec GitHub"><i class="fa-brands fa-github"></i></a>
             <a href="#" class="icon" title="Se connecter avec Apple"><i class="fa-brands fa-apple"></i></a>
             <a href="#" class="icon" title="Se connecter avec LinkedIn"><i class="fa-brands fa-linkedin"></i></a>  
              </div>
              <input type="text"
               placeholder="Email" class="incs" />
                 <input type="password"
               placeholder="Mot de passe" class="incs" />
               <a href="#" class="mdpo" title="Mot de passe oublié ?">Mot de passe oublié ?</a>
               <button type="submit">Se connecter</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1 class="nom">Content de te revoir !</h1>
                    <p>Entrez vos infos personnelles pour utiliser toutes les fonctionnalités du site</p>
                    <button class="click" id="login">Se connecter</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1 class="nom">Salut !</h1>
                    <p>Inscrivez-vous avec vos informations personnelles pour utiliser toutes les fonctionnalités du site</p>
                    <button class="click" id="register">Inscrire</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
const registerBtn = document.getElementById('register');
const loginBtn = document.getElementById('login');

registerBtn.addEventListener('click', () => {
    container.classList.add("active");
});

loginBtn.addEventListener('click', () => {
    container.classList.remove("active");
});
    </script>
</body>
</html>
