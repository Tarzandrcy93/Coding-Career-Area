<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peugeot France | STC</title>
    <link rel="stylesheet" href="peugeot.css" />
    <link rel="icon" href="Peugeot_2021_Logo.svg.png" type="image/x-icon" />

<body>
  <img src="r.png" class="pgt" alt="Peugeot" />

    <div class="slide">
      <img src="concept-508-peugeot-sport-engineered.jpg" class="pgt1" alt="Peugeot Car" />
      <p class="pimg13">508 PSE ( Peugeot Sport Engineering)</p>
      <p class="pimg123">Dès <strong>375</strong> €/mois <br />SANS RAPPORT <br />LLD 49 MOIS <br />40 000 KM SOUS CONDITION DE REPRISE</p>
    </div>
  </div>

  <div class="icone">
   <img src="t.png" alt="loc" class="loc">
   <img src="f.png" alt="fr" class="form">
   <img src="v.png" alt="v" class="vol">
   <img src="tel.png" alt="tel" class="tel">
