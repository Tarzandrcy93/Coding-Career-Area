<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator BMI | STC</title>
    <link rel="stylesheet" href="bmi.css">
</head>
<body>
    <div class="container">
        <h1>Bienvenue sur la calculatrice de BMI (Indice de masse corporelle)</h1>
        <form id="bmi-form">
            <label for="weight" class="ecr1">Poids (kg):</label>
            <input type="number" id="weight" name="weight" class="c" required>
            <label for="height" class="ecr">Taille (cm):</label>
            <input type="number" id="height" name="height" required>
            <button type="submit" class="submit">Calculer le BMI</button>
            <div id="result"></div>
        </form>
    </div>

    <script src="bmi.js"></script>
</body>
</html>
