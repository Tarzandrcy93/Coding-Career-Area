<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator BMI | TZN </title>
    <link rel="stylesheet" href="bmi.css">
    <link rel="icon" href="istockphoto-1361979553-612x612.jpg" type="image/x-icon">
</head>
<body>
    <div class="container">
    <div class="box">
      <img src="istockphoto-1361979553-612x612.jpg" alt="Horloge" class="b" />
      <div class="input">
        <label for="age">Age</label>
        <input type="text" class="text-input" id="age" autocomplete="off" required>
      </div>
      <div class="gender">
        <label class="container">
          <input type="radio" name="radio" id="m">
          <p class="text">Homme</p>
          <span class="checkmark"></span>
        </label>
        <label class="container">
          <input type="radio" name="radio" id="f">
          <p class="text">Femme</p>
          <span class="checkmark"></span>
        </label>
      </div>
      <div class="containerH">
        <div class="inputH">
          <label for="height">Taille (cm)</label>
          <input type="number" id="height" required>
        </div>
        <div class="inputW">
          <label for="weight">Poids (kg)</label>
          <input type="number" id="weight" required>
        </div>
      </div>
      <div class="calculate">
        <button id="submit" onclick="calculate();">Calculer le BMI</button>
      </div>
      <div class="result">
        <p>Ton BMI est de </p>
        <div id="result">Erreur</div>
        <div class="comment"></div>
      </div>
    </div>


    <script src="bmi.js"></script>
</body>
</html>
