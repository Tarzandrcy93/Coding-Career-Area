<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculateur de Moyenne Générale</title>
    <link rel="stylesheet" href="cmg.css" />
     <link rel="icon" href="téléchargé (3).png" type="image/x-icon">
  </head>
  <body>
  <div class="cont"></div>
    <div class="container">
      <h1>Calculateur de Moyenne Générale</h1>

    <div class="box">
      <div class="input">
        <input type="number" id="note" placeholder="Français" />
      </div>
      <br>
      <div class="input">
        <input type="number" class="note" placeholder="Maths" />
      </div>
      <br>
      <div class="input">
        <input type="number" class="note" placeholder="Histoire/Géo/EMC" />
      </div>
      <br>
      <div
       class="input">
        <input type="number" class="note" placeholder="Physique-Chimie" />
      </div>
      <br>
      <div class="input">
        <input type="number" class="note" placeholder="SVT" />
      </div>
       <br>
      <div class="input">
        <input type="number" class="note" placeholder="Technologie" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="Anglais" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="LV2" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="EPS" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="Musique" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="Art Plastiques" />
      </div>
        <br>
      <div class="input">
        <input type="number" class="note" placeholder="Une option" />
      </div>
      </div>

      <button class="submit" onclick="calculate()">Calculer la Moyenne</button>
      <div class="result">
        <p>Ta Moyenne Générale est de</p>
          <div class="result-value">Erreur</div>
          <br>
          <div class="commentaire"></div>
      </div>
    </div>
   </div>

    <script src="cmg.js"></script>
  </body>
</html>
